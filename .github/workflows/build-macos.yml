name: Build macOS App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install tooling
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          go install github.com/dkorunic/betteralign/cmd/betteralign@latest

      - name: Check formatting
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9

      - name: Betteralign
        run: ~/go/bin/betteralign ./...

      - name: Build Go code
        run: go build ./...

      - name: Package app bundle
        run: |
          ~/go/bin/fyne package -os darwin -name MicroView -release

          LIBUSB_PREFIX="$(brew --prefix libusb)"
          LIBUSB_DYLIB="$LIBUSB_PREFIX/lib/libusb-1.0.0.dylib"

          mkdir -p "MicroView.app/Contents/Frameworks"
          cp "$LIBUSB_DYLIB" "MicroView.app/Contents/Frameworks/"

          install_name_tool -change \
            "$LIBUSB_DYLIB" \
            "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
            "MicroView.app/Contents/MacOS/microview"

          install_name_tool -id \
            "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
            "MicroView.app/Contents/Frameworks/libusb-1.0.0.dylib"

          codesign --force --sign - "MicroView.app/Contents/Frameworks/libusb-1.0.0.dylib"
          codesign --force --sign - "MicroView.app/Contents/MacOS/microview"
          codesign --force --deep --sign - "MicroView.app"

      - name: Stage app artifact
        run: |
          mkdir -p artifact
          ditto "MicroView.app" "artifact/MicroView.app"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: MicroView-macos
          path: artifact
